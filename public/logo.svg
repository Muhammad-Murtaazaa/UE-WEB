<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Brand Icon Emblem -->
  <g transform="translate(4, 4)">
    <!-- Base Rounded Shield / Hexagon -->
    <rect width="56" height="56" rx="14" fill="#240713" stroke="#800020" stroke-width="2" />
    <rect x="3" y="3" width="50" height="50" rx="11" fill="url(#crest-grad)" />
    
    <!-- Stylized Modern U-S-E Textile Monogram -->
    <!-- U Outer Curve -->
    <path d="M17 17v13c0 6.075 4.925 11 11 11s11-4.925 11-11V17" stroke="#FAF7F5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- S Ribbon intertwined -->
    <path d="M34 22c-1.5-2.2-4-3.2-6.8-3.2-4.2 0-7 2.2-7 5.2 0 4.2 8.5 3.5 8.5 7.8 0 2.2-2.1 3.8-5.2 3.8-3.2 0-5.8-1.5-7.5-3.8" stroke="#D4AF37" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- E Accent Bar -->
    <circle cx="28" cy="28" r="2.2" fill="#D4AF37" />
    
    <!-- Subtle Golden Corner Nodes -->
    <circle cx="12" cy="12" r="1.5" fill="#D4AF37" opacity="0.6"/>
    <circle cx="44" cy="12" r="1.5" fill="#D4AF37" opacity="0.6"/>
    <circle cx="12" cy="44" r="1.5" fill="#D4AF37" opacity="0.6"/>
    <circle cx="44" cy="44" r="1.5" fill="#D4AF37" opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="74" y="27" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#1A0A10" letter-spacing="-0.03em">
    UZAIR SHARIF
  </text>
  <text x="74" y="44" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#800020" letter-spacing="0.18em">
    ENTERPRISES
  </text>
  <text x="74" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#7A686F" letter-spacing="0.04em">
    SMC-PVT LTD • PAKISTAN
  </text>

  <defs>
    <linearGradient id="crest-grad" x1="3" y1="3" x2="53" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A0D1F" />
      <stop offset="100%" stop-color="#1F040E" />
    </linearGradient>
  </defs>
</svg>
